<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Máy tính</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #182433;
    font-family: Arial, sans-serif;
    touch-action: manipulation;
  }

  body {
    padding: 12px;
  }

  .app {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
  }

  .calculator {
    width: 100%;
    background: #ffffff;
    border-radius: 28px;
    padding: 20px;
  }

  .display {
    width: 100%;
    height: 120px;
    border: none;
    border-radius: 20px;
    background: #e5e7eb;
    color: #111827;
    padding: 18px;
    text-align: right;
    font-size: 48px;
    outline: none;
    margin-bottom: 18px;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  button {
    height: 88px;
    border: none;
    border-radius: 18px;
    background: #e5e7eb;
    color: #111827;
    font-size: 32px;
    cursor: pointer;
    touch-action: manipulation;
  }

  button:active {
    transform: scale(0.96);
  }

  .operator {
    background: #f9a000;
    color: white;
  }

  .clear {
    background: #fb4146;
    color: white;
  }

  .equal {
    grid-column: span 2;
    background: #10b981;
    color: white;
  }

  .zero {
    grid-column: span 2;
  }

  .history-box {
    width: 100%;
    margin-top: 14px;
    background: white;
    border-radius: 22px;
    padding: 18px;
  }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .history-header h2 {
    margin: 0;
    font-size: 21px;
    color: #111827;
  }

  .clear-history {
    width: auto;
    height: auto;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    background: #6b7280;
    color: white;
  }

  .history-item {
    border-bottom: 1px solid #e5e7eb;
    padding: 12px 0;
    font-size: 18px;
    color: #374151;
  }

  .history-item strong {
    display: block;
    margin-top: 5px;
    color: #111827;
    font-size: 21px;
  }

  .empty-history {
    margin: 0;
    color: #9ca3af;
  }

  @media (max-width: 380px) {
    body {
      padding: 8px;
    }

    .calculator {
      padding: 14px;
      border-radius: 22px;
    }

    .display {
      height: 100px;
      font-size: 40px;
    }

    .buttons {
      gap: 10px;
    }

    button {
      height: 72px;
      font-size: 28px;
      border-radius: 15px;
    }
  }
</style>
</head>

<body>
<div class="app">
  <div class="calculator">
    <input type="text" id="display" class="display" value="0" readonly>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue(':')">:</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('x')">x</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button class="zero" onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <div class="history-box">
    <div class="history-header">
      <h2>Lịch sử</h2>
      <button class="clear-history" onclick="clearHistory()">Xóa lịch sử</button>
    </div>
    <div id="history">
      <p class="empty-history">Chưa có phép tính nào.</p>
    </div>
  </div>
</div>

<script>
  const display = document.getElementById("display");
  const historyBox = document.getElementById("history");
  let history = [];

  function appendValue(value) {
    if (display.value === "0" || display.value === "Lỗi") {
      display.value = "";
    }
    display.value += value;
  }

  function clearDisplay() {
    display.value = "0";
  }

  function deleteLast() {
    if (display.value === "Lỗi") {
      display.value = "0";
      return;
    }

    display.value = display.value.slice(0, -1);

    if (display.value === "") {
      display.value = "0";
    }
  }

  function calculate() {
    try {
      const expression = display.value;

      if (!/^[0-9+\-x:%(). ]+$/.test(expression)) {
        throw new Error();
      }

      const calculation = expression
        .replaceAll("x", "*")
        .replaceAll(":", "/");

      const result = eval(calculation);

      if (!isFinite(result)) {
        throw new Error();
      }

      history.unshift({
        expression: expression,
        result: result
      });

      display.value = result;
      renderHistory();
    } catch {
      display.value = "Lỗi";
    }
  }

  function renderHistory() {
    if (history.length === 0) {
      historyBox.innerHTML = '<p class="empty-history">Chưa có phép tính nào.</p>';
      return;
    }

    historyBox.innerHTML = history.map((item, index) => `
      <div class="history-item" onclick="useHistory(${index})">
        ${item.expression}
        <strong>= ${item.result}</strong>
      </div>
    `).join("");
  }

  function useHistory(index) {
    display.value = history[index].expression;
  }

  function clearHistory() {
    history = [];
    renderHistory();
  }

  document.addEventListener("keydown", function(event) {
    const key = event.key;

    if ("0123456789+-%.()".includes(key)) {
      appendValue(key);
    } else if (key === "*" || key === "x" || key === "X") {
      appendValue("x");
    } else if (key === "/" || key === ":") {
      appendValue(":");
    } else if (key === "Enter" || key === "=") {
      calculate();
    } else if (key === "Backspace") {
      deleteLast();
    } else if (key === "Escape") {
      clearDisplay();
    }
  });

  document.addEventListener("dblclick", function(event) {
    event.preventDefault();
  });
</script>
</body>
</html>
