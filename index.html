<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NES // Cartridge Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#100e14;
  --shell:#cfc9ba;
  --shell-dark:#a8a196;
  --shell-shadow:#6d685f;
  --bezel:#232025;
  --red:#c8433a;
  --red-dark:#922e28;
  --ink:#201d22;
  --paper:#ece6d6;
  --ok:#6f9e6a;
  --pixel:"Press Start 2P",monospace;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
  background:radial-gradient(circle at 20% 10%,#1b1720 0%,var(--bg) 55%) fixed;
  color:var(--paper);
  font-family:var(--body);
}
#app{
  height:100%;
  display:flex;
  flex-direction:column;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 14px;
  flex:0 0 auto;
}
.logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--pixel);
  font-size:11px;
  letter-spacing:1px;
  white-space:nowrap;
}
.logo .dot{
  width:8px;
  height:8px;
  background:var(--red);
  box-shadow:0 0 6px var(--red);
}
.info-text{
  margin-left:auto;
  color:#8a8492;
  font-size:10px;
  white-space:nowrap;
}
.hdr-btns{
  display:flex;
  gap:6px;
}
.icon-btn{
  width:34px;
  height:34px;
  border:1px solid #3a3540;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--ink);
  color:var(--paper);
  font-size:15px;
  cursor:pointer;
  touch-action:manipulation;
}
.icon-btn:active{
  transform:translateY(1px);
  background:#2a2630;
}
.icon-btn.on{
  border-color:var(--red);
  color:var(--red);
}
#loader{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:0 14px 8px;
  padding:10px;
  border:1px dashed #47414d;
  border-radius:10px;
  color:#aaa2b1;
  font-size:11px;
  flex:0 0 auto;
}
#loader.drag{
  border-color:var(--red);
  background:rgba(200,67,58,.08);
}
#loader input{
  display:none;
}
.load-btn{
  border:1px solid #3a3540;
  border-radius:20px;
  padding:7px 13px;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--body);
  font-size:12px;
  cursor:pointer;
  touch-action:manipulation;
}
.load-btn:active{
  background:#2a2630;
}
#main{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}
#stage{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4px 10px;
}
#shell{
  max-width:100%;
  max-height:100%;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:14px;
  border-radius:14px;
  background:linear-gradient(180deg,var(--shell),var(--shell-dark));
  box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4);
}
.shell-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 4px;
}
.brand{
  font-family:var(--pixel);
  color:var(--shell-shadow);
  font-size:8px;
  letter-spacing:1px;
}
.led{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#3a2f2f;
  box-shadow:inset 0 0 1px #000;
}
.led.live{
  background:var(--ok);
  box-shadow:0 0 5px var(--ok);
}
#screen-frame{
  display:flex;
  padding:8px;
  border-radius:6px;
  background:var(--bezel);
  box-shadow:inset 0 0 0 2px #0b0a0c,inset 0 2px 10px rgba(0,0,0,.6);
}
#canvas-wrap{
  position:relative;
  line-height:0;
  max-width:100%;
  max-height:calc(100dvh - 240px);
}
canvas{
  display:block;
  width:100%;
  height:100%;
  background:#000;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
#placeholder{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px;
  color:#5b5764;
  text-align:center;
  font-size:12px;
  line-height:1.6;
}
#controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 18px calc(14px + env(safe-area-inset-bottom));
  flex:0 0 auto;
}
#dpad{
  position:relative;
  width:132px;
  height:132px;
  flex:0 0 auto;
  touch-action:none;
}
#dpad svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
.zone-fill{
  fill:var(--ink);
  stroke:#3a3540;
  stroke-width:1;
}
.arrow{
  fill:#5b5764;
}
.arrow.active{
  fill:var(--red);
}
#dpad-touch{
  position:absolute;
  inset:0;
  border-radius:50%;
  touch-action:none;
}
#dpad-center-dot{
  position:absolute;
  top:50%;
  left:50%;
  width:14px;
  height:14px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#0c0b0e;
  box-shadow:inset 0 0 3px #000;
  pointer-events:none;
}
#center-btns{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.pill-btn{
  width:62px;
  padding:8px 10px;
  border-radius:20px;
  background:linear-gradient(180deg,#8c8798,#68626f);
  color:#2a2630;
  box-shadow:0 3px 0 #423e48,0 4px 6px rgba(0,0,0,.4);
  font-family:var(--pixel);
  font-size:7px;
  text-align:center;
  cursor:pointer;
  touch-action:manipulation;
}
.pill-btn.pressed,
.pill-btn:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #423e48;
}
#ab-btns{
  position:relative;
  width:150px;
  height:110px;
  flex:0 0 auto;
  touch-action:none;
}
.ab-btn{
  position:absolute;
  width:64px;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--red),var(--red-dark));
  color:#f2e3d8;
  box-shadow:0 4px 0 #661f1a,0 6px 10px rgba(0,0,0,.45);
  font-family:var(--pixel);
  font-size:18px;
  touch-action:none;
}
#ab-btns .pressed,
#ab-btns .ab-btn:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #661f1a;
  filter:brightness(1.15);
}
#btn-b{left:0;bottom:0}
#btn-a{right:0;top:0}
footer{
  flex:0 0 auto;
  padding:0 10px 8px;
  color:#5b5764;
  font-size:10px;
  text-align:center;
}
footer kbd{
  padding:1px 5px;
  border:1px solid #3a3540;
  border-radius:4px;
  background:#221f27;
  font-size:10px;
}
@media (orientation:landscape) and (max-height:560px) and (hover:none) and (pointer:coarse){
  header{padding:4px 10px}
  .info-text,footer{display:none}
  #loader{display:none}
  #main{
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:6px 14px;
  }
  #stage{
    order:2;
    padding:0;
  }
  #canvas-wrap{
    max-height:88dvh;
  }
  #controls{
    display:contents;
  }
  #dpad{order:1}
  #ab-btns{order:3}
  #center-btns{display:none}
}
@media (max-width:500px) and (orientation:portrait){
  .logo{font-size:8px}
  .info-text{display:none}
  #controls{padding-left:12px;padding-right:12px}
  #dpad{width:118px;height:118px}
  #ab-btns{width:135px;height:100px}
  .ab-btn{width:58px;height:58px}
}
</style>
</head>

<body>
<div id="app">

  <header>
    <div class="logo"><span class="dot"></span>NES // CARTRIDGE PLAYER</div>
    <div class="info-text" id="fps">FPS: 0 | Audio: OK</div>
    <div class="hdr-btns">
      <div class="icon-btn" id="btn-mute" title="Tắt/bật âm thanh">🔊</div>
      <div class="icon-btn" id="btn-pause" title="Tạm dừng">⏸</div>
      <div class="icon-btn" id="btn-reset" title="Chơi lại từ đầu">⟲</div>
      <div class="icon-btn" id="btn-fullscreen" title="Toàn màn hình">⛶</div>
    </div>
  </header>

  <div id="loader">
    <span id="rom-status">Đang nạp Super Mario Bros...</span>
    <button class="load-btn" id="choose-rom">▸ CHỌN GAME .NES</button>
    <input type="file" id="rom-input" accept=".nes">
  </div>

  <div id="main">
    <div id="stage">
      <div id="shell">
        <div class="shell-row">
          <span class="brand">◆ NES-Dang Minh Nhut</span>
          <span class="led" id="power-led"></span>
        </div>

        <div id="screen-frame">
          <div id="canvas-wrap">
            <canvas id="screen" width="256" height="240"></canvas>
            <div id="placeholder">ĐANG NẠP SUPER MARIO BROS...</div>
          </div>
        </div>
      </div>
    </div>

    <div id="controls">
      <div id="dpad">
        <svg viewBox="0 0 132 132">
          <path class="zone-fill" d="M44 4 H88 V44 H128 V88 H88 V128 H44 V88 H4 V44 H44 Z"/>
          <polygon class="arrow" id="arrow-up" points="66,14 58,30 74,30"/>
          <polygon class="arrow" id="arrow-down" points="66,118 58,102 74,102"/>
          <polygon class="arrow" id="arrow-left" points="14,66 30,58 30,74"/>
          <polygon class="arrow" id="arrow-right" points="118,66 102,58 102,74"/>
        </svg>
        <div id="dpad-touch"></div>
        <div id="dpad-center-dot"></div>
      </div>

      <div id="center-btns">
        <div class="pill-btn" id="btn-select">SELECT</div>
        <div class="pill-btn" id="btn-start">START</div>
      </div>

      <div id="ab-btns">
        <div class="ab-btn" id="btn-b">B</div>
        <div class="ab-btn" id="btn-a">A</div>
      </div>
    </div>
  </div>

  <footer>Bàn phím: <kbd>↑↓←→</kbd> di chuyển · <kbd>X</kbd>=A · <kbd>Z</kbd>=B · <kbd>Enter</kbd>=Start · <kbd>Shift</kbd>=Select</footer>
</div>

<script src="https://unpkg.com/jsnes@2/dist/jsnes.min.js"></script>

<script>
(function(){
  "use strict";

  var MARIO_ROM_URL = "https://github.com/nhut990/files/raw/refs/heads/main/music/SuperMarioBros.nes";

  document.addEventListener("gesturestart", function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener("gesturechange", function(e){ e.preventDefault(); }, {passive:false});

  var canvas = document.getElementById("screen");
  var ctx = canvas.getContext("2d", {
    alpha:false,
    desynchronized:true
  });

  ctx.imageSmoothingEnabled = false;

  var imageData = ctx.createImageData(256, 240);
  var buf32 = new Uint32Array(imageData.data.buffer);

  var placeholder = document.getElementById("placeholder");
  var powerLed = document.getElementById("power-led");
  var fpsDisplay = document.getElementById("fps");
  var statusText = document.getElementById("rom-status");

  var audioCtx = null;
  var scriptNode = null;
  var gainNode = null;
  var muted = false;

  var AUDIO_BUFFER_SIZE = 8192;
  var audioBuffer = {
    left:new Float32Array(AUDIO_BUFFER_SIZE),
    right:new Float32Array(AUDIO_BUFFER_SIZE),
    writeIdx:0,
    readIdx:0
  };

  function ensureAudio(){
    if(audioCtx) return;

    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if(!AudioContextClass) return;

    audioCtx = new AudioContextClass({sampleRate:44100});
    gainNode = audioCtx.createGain();
    gainNode.gain.value = muted ? 0 : 0.3;

    scriptNode = audioCtx.createScriptProcessor(2048, 0, 2);

    scriptNode.onaudioprocess = function(e){
      var outL = e.outputBuffer.getChannelData(0);
      var outR = e.outputBuffer.getChannelData(1);
      var available = (audioBuffer.writeIdx - audioBuffer.readIdx + AUDIO_BUFFER_SIZE) % AUDIO_BUFFER_SIZE;

      if(available >= outL.length){
        for(var i = 0; i < outL.length; i++){
          outL[i] = audioBuffer.left[audioBuffer.readIdx];
          outR[i] = audioBuffer.right[audioBuffer.readIdx];
          audioBuffer.readIdx = (audioBuffer.readIdx + 1) % AUDIO_BUFFER_SIZE;
        }
      }else{
        for(var j = 0; j < outL.length; j++){
          outL[j] = 0;
          outR[j] = 0;
        }
      }
    };

    scriptNode.connect(gainNode);
    gainNode.connect(audioCtx.destination);
  }

  function resumeAudio(){
    ensureAudio();
    if(audioCtx && audioCtx.state === "suspended"){
      audioCtx.resume();
    }
  }

  var skipRender = false;
  var frameCount = 0;
  var perfData = {audioStatus:"OK"};

  var nes = new jsnes.NES({
    onFrame:function(frameBuffer){
      if(skipRender) return;

      for(var i = 0; i < 256 * 240; i++){
        buf32[i] = 0xff000000 | frameBuffer[i];
      }

      ctx.putImageData(imageData, 0, 0);
      frameCount++;
    },

    onAudioSample:function(left, right){
      var next = (audioBuffer.writeIdx + 1) % AUDIO_BUFFER_SIZE;

      if(next !== audioBuffer.readIdx){
        audioBuffer.left[audioBuffer.writeIdx] = left;
        audioBuffer.right[audioBuffer.writeIdx] = right;
        audioBuffer.writeIdx = next;
      }
    },

    sampleRate:44100
  });

  var romLoaded = false;
  var running = false;
  var rafId = null;
  var lastRomData = null;
  var lastTime = 0;
  var accumulator = 0;

  var FRAME_MS = 1000 / 60.0988;
  var MAX_CATCHUP_FRAMES = 3;

  setInterval(function(){
    fpsDisplay.textContent = "FPS: " + frameCount + " | Audio: " + perfData.audioStatus;
    frameCount = 0;
  }, 1000);

  function tick(now){
    rafId = requestAnimationFrame(tick);

    if(!running || !romLoaded) return;

    if(!lastTime) lastTime = now;

    var delta = now - lastTime;
    lastTime = now;

    if(delta > 250) delta = 250;
    if(delta < 0) delta = 0;

    accumulator += delta;

    var framesToRun = 0;

    while(accumulator >= FRAME_MS && framesToRun < MAX_CATCHUP_FRAMES){
      accumulator -= FRAME_MS;
      framesToRun++;
    }

    if(framesToRun === 0) return;

    for(var i = 0; i < framesToRun; i++){
      skipRender = i < framesToRun - 1;
      nes.frame();
    }

    if(audioCtx){
      var available = (audioBuffer.writeIdx - audioBuffer.readIdx + AUDIO_BUFFER_SIZE) % AUDIO_BUFFER_SIZE;

      if(available < 512) perfData.audioStatus = "LOW";
      else if(available > 7000) perfData.audioStatus = "HIGH";
      else perfData.audioStatus = "OK";
    }
  }

  function startLoop(){
    if(running) return;

    running = true;
    lastTime = 0;
    accumulator = 0;
    powerLed.classList.add("live");

    if(rafId === null){
      rafId = requestAnimationFrame(tick);
    }
  }

  function stopLoop(){
    running = false;
    powerLed.classList.remove("live");
  }

  function loadRom(data, name){
    try{
      stopLoop();

      audioBuffer.writeIdx = 0;
      audioBuffer.readIdx = 0;

      nes.loadROM(data);

      lastRomData = data;
      romLoaded = true;

      placeholder.style.display = "none";
      statusText.textContent = "Đang chơi: " + (name || "Game .NES");

      startLoop();
    }catch(err){
      romLoaded = false;
      placeholder.style.display = "flex";
      placeholder.innerHTML = "KHÔNG ĐỌC ĐƯỢC ROM<br>HÃY CHỌN FILE .NES KHÁC";
      statusText.textContent = "Không thể nạp game";
      console.error(err);
      alert("Không đọc được ROM này: " + err.message);
    }
  }

  function loadDefaultMario(){
    statusText.textContent = "Đang nạp Super Mario Bros...";
    placeholder.style.display = "flex";
    placeholder.textContent = "ĐANG NẠP SUPER MARIO BROS...";

    fetch(MARIO_ROM_URL)
      .then(function(response){
        if(!response.ok){
          throw new Error("Không thể tải Super Mario Bros.");
        }
        return response.arrayBuffer();
      })
      .then(function(buffer){
        loadRom(new Uint8Array(buffer), "Super Mario Bros.");
      })
      .catch(function(err){
        console.error(err);
        placeholder.innerHTML = "KHÔNG THỂ TẢI MARIO<br>HÃY KIỂM TRA KẾT NỐI";
        statusText.textContent = "Mario chưa được nạp";
      });
  }

  var loader = document.getElementById("loader");
  var fileInput = document.getElementById("rom-input");
  var chooseRom = document.getElementById("choose-rom");

  chooseRom.addEventListener("click", function(e){
    e.stopPropagation();
    fileInput.click();
  });

  loader.addEventListener("click", function(){
    fileInput.click();
  });

  fileInput.addEventListener("change", function(){
    var file = fileInput.files[0];
    if(file) readFile(file);
    fileInput.value = "";
  });

  loader.addEventListener("dragover", function(e){
    e.preventDefault();
    loader.classList.add("drag");
  });

  loader.addEventListener("dragleave", function(e){
    e.preventDefault();
    loader.classList.remove("drag");
  });

  loader.addEventListener("drop", function(e){
    e.preventDefault();
    loader.classList.remove("drag");

    var file = e.dataTransfer.files[0];
    if(file) readFile(file);
  });

  function readFile(file){
    if(!file.name.toLowerCase().endsWith(".nes")){
      alert("Vui lòng chọn đúng file game có đuôi .nes");
      return;
    }

    statusText.textContent = "Đang nạp: " + file.name;
    placeholder.style.display = "flex";
    placeholder.textContent = "ĐANG NẠP GAME...";

    var reader = new FileReader();

    reader.onload = function(){
      loadRom(new Uint8Array(reader.result), file.name);
    };

    reader.onerror = function(){
      placeholder.innerHTML = "KHÔNG ĐỌC ĐƯỢC FILE";
      statusText.textContent = "Lỗi đọc file";
    };

    reader.readAsArrayBuffer(file);
  }

  document.getElementById("btn-mute").addEventListener("click", function(e){
    resumeAudio();

    muted = !muted;

    if(gainNode){
      gainNode.gain.value = muted ? 0 : 0.3;
    }

    e.currentTarget.textContent = muted ? "🔇" : "🔊";
    e.currentTarget.classList.toggle("on", muted);
  });

  document.getElementById("btn-pause").addEventListener("click", function(e){
    if(!romLoaded) return;

    if(running){
      stopLoop();
      e.currentTarget.textContent = "▶";
      e.currentTarget.classList.add("on");
    }else{
      startLoop();
      e.currentTarget.textContent = "⏸";
      e.currentTarget.classList.remove("on");
      resumeAudio();
    }
  });

  document.getElementById("btn-reset").addEventListener("click", function(){
    if(lastRomData){
      loadRom(lastRomData, statusText.textContent.replace("Đang chơi: ", ""));
      resumeAudio();
    }
  });

  document.getElementById("btn-fullscreen").addEventListener("click", function(e){
    var app = document.getElementById("app");

    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      if(app.requestFullscreen) app.requestFullscreen();
      else if(app.webkitRequestFullscreen) app.webkitRequestFullscreen();

      e.currentTarget.classList.add("on");
    }else{
      if(document.exitFullscreen) document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();

      e.currentTarget.classList.remove("on");
    }
  });

  var C = jsnes.Controller;

  function vibrate(ms){
    if(navigator.vibrate) navigator.vibrate(ms);
  }

  function down(button){
    nes.buttonDown(1, button);
    resumeAudio();
  }

  function up(button){
    nes.buttonUp(1, button);
  }

  var dpadTouch = document.getElementById("dpad-touch");
  var dpadPointer = null;

  var dpadState = {
    up:false,
    down:false,
    left:false,
    right:false
  };

  var arrows = {
    up:document.getElementById("arrow-up"),
    down:document.getElementById("arrow-down"),
    left:document.getElementById("arrow-left"),
    right:document.getElementById("arrow-right")
  };

  var directionMap = {
    up:C.BUTTON_UP,
    down:C.BUTTON_DOWN,
    left:C.BUTTON_LEFT,
    right:C.BUTTON_RIGHT
  };

  function setDir(direction, active){
    if(dpadState[direction] === active) return;

    dpadState[direction] = active;

    if(active){
      down(directionMap[direction]);
      arrows[direction].classList.add("active");
    }else{
      up(directionMap[direction]);
      arrows[direction].classList.remove("active");
    }
  }

  function clearDpad(){
    setDir("up", false);
    setDir("down", false);
    setDir("left", false);
    setDir("right", false);
  }

  function updateDpad(clientX, clientY){
    var rect = dpadTouch.getBoundingClientRect();
    var centerX = rect.left + rect.width / 2;
    var centerY = rect.top + rect.height / 2;

    var dx = clientX - centerX;
    var dy = clientY - centerY;
    var distance = Math.sqrt(dx * dx + dy * dy);
    var deadzone = rect.width * 0.16;

    if(distance < deadzone){
      clearDpad();
      return;
    }

    var angle = Math.atan2(dy, dx) * 180 / Math.PI;

    setDir("up", angle < -22.5 && angle > -157.5);
    setDir("down", angle > 22.5 && angle < 157.5);
    setDir("right", angle >= -67.5 && angle <= 67.5);
    setDir("left", angle >= 112.5 || angle <= -112.5);
  }

  dpadTouch.addEventListener("pointerdown", function(e){
    if(dpadPointer !== null) return;

    dpadPointer = e.pointerId;
    dpadTouch.setPointerCapture(e.pointerId);

    updateDpad(e.clientX, e.clientY);
    vibrate(8);
    e.preventDefault();
  });

  dpadTouch.addEventListener("pointermove", function(e){
    if(e.pointerId !== dpadPointer) return;

    updateDpad(e.clientX, e.clientY);
    e.preventDefault();
  });

  function releaseDpad(e){
    if(e.pointerId !== dpadPointer) return;

    dpadPointer = null;
    clearDpad();
    e.preventDefault();
  }

  dpadTouch.addEventListener("pointerup", releaseDpad);
  dpadTouch.addEventListener("pointercancel", releaseDpad);

  function bindButton(element, nesButton, strong){
    var pointers = new Set();

    function press(id){
      if(pointers.has(id)) return;

      pointers.add(id);

      if(pointers.size === 1){
        down(nesButton);
        element.classList.add("pressed");
        vibrate(strong ? 15 : 8);
      }
    }

    function release(id){
      if(!pointers.has(id)) return;

      pointers.delete(id);

      if(pointers.size === 0){
        up(nesButton);
        element.classList.remove("pressed");
      }
    }

    element.addEventListener("pointerdown", function(e){
      element.setPointerCapture(e.pointerId);
      press(e.pointerId);
      e.preventDefault();
    });

    element.addEventListener("pointerup", function(e){
      release(e.pointerId);
      e.preventDefault();
    });

    element.addEventListener("pointercancel", function(e){
      release(e.pointerId);
      e.preventDefault();
    });

    return {
      press:function(){ press("keyboard"); },
      release:function(){ release("keyboard"); }
    };
  }

  var btnA = bindButton(document.getElementById("btn-a"), C.BUTTON_A, true);
  var btnB = bindButton(document.getElementById("btn-b"), C.BUTTON_B, true);
  var btnStart = bindButton(document.getElementById("btn-start"), C.BUTTON_START, false);
  var btnSelect = bindButton(document.getElementById("btn-select"), C.BUTTON_SELECT, false);

  var keyMap = {
    ArrowUp:"up",
    ArrowDown:"down",
    ArrowLeft:"left",
    ArrowRight:"right"
  };

  window.addEventListener("keydown", function(e){
    if(e.repeat) return;

    if(keyMap[e.key]){
      setDir(keyMap[e.key], true);
      e.preventDefault();
      return;
    }

    if(e.key === "x" || e.key === "X"){
      btnA.press();
      e.preventDefault();
    }else if(e.key === "z" || e.key === "Z"){
      btnB.press();
      e.preventDefault();
    }else if(e.key === "Enter"){
      btnStart.press();
      e.preventDefault();
    }else if(e.key === "Shift"){
      btnSelect.press();
      e.preventDefault();
    }
  });

  window.addEventListener("keyup", function(e){
    if(keyMap[e.key]){
      setDir(keyMap[e.key], false);
      e.preventDefault();
      return;
    }

    if(e.key === "x" || e.key === "X"){
      btnA.release();
      e.preventDefault();
    }else if(e.key === "z" || e.key === "Z"){
      btnB.release();
      e.preventDefault();
    }else if(e.key === "Enter"){
      btnStart.release();
      e.preventDefault();
    }else if(e.key === "Shift"){
      btnSelect.release();
      e.preventDefault();
    }
  });

  window.addEventListener("blur", function(){
    clearDpad();
    btnA.release();
    btnB.release();
    btnStart.release();
    btnSelect.release();
  });

  document.body.addEventListener("pointerdown", function(){
    resumeAudio();
  }, {passive:true});

  loadDefaultMario();
})();
</script>
</body>
</html>
