<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Super Mario Bros - NES</title>

<script src="https://cdn.jsdelivr.net/npm/jsnes@1.2.1/dist/jsnes.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

:root{
  --bg:#0a0f1d;
  --panel:#161f36;
  --border:#3b4c73;
  --text:#eef3ff;
  --muted:#9ba9ca;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  background:radial-gradient(circle at top,#293965 0%,#11192f 44%,#070b15 100%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  min-height:100dvh;
}

.app{
  width:min(100%,760px);
  min-height:100vh;
  min-height:100dvh;
  margin:auto;
  padding:16px 14px calc(26px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:14px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  font-weight:800;
  letter-spacing:.5px;
  white-space:nowrap;
}

.brand-icon{
  width:40px;
  height:27px;
  display:grid;
  place-items:center;
  border:2px solid #fff;
  border-radius:8px;
  background:linear-gradient(145deg,#ff6578,#bc2447);
  box-shadow:0 4px 10px rgba(0,0,0,.3);
  font-size:12px;
}

.status{
  max-width:56%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:var(--muted);
  font-size:12px;
  text-align:right;
}

.screen-box{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  overflow:hidden;
  border:5px solid #394866;
  border-radius:16px;
  background:#000;
  box-shadow:0 15px 35px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.05);
}

canvas{
  display:block;
  width:100%;
  height:100%;
  background:#000;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

.screen-message{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:24px;
  text-align:center;
  background:radial-gradient(circle,rgba(35,49,84,.92),rgba(5,8,16,.97));
}

.screen-message strong{
  font-size:20px;
}

.screen-message span{
  color:#b0bddc;
  font-size:13px;
  line-height:1.5;
}

.top-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  min-height:46px;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  background:linear-gradient(145deg,#293756,#151d31);
  box-shadow:0 4px 0 #080c16,0 7px 14px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.12);
  font:inherit;
  font-weight:700;
  cursor:pointer;
  touch-action:manipulation;
}

button:active,
.control.pressed,
.middle.pressed{
  transform:translateY(3px) scale(.98);
  box-shadow:0 1px 0 #080c16,inset 0 2px 8px rgba(0,0,0,.42);
  filter:brightness(.88);
}

.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-top:auto;
  padding:8px 4px 0;
}

.dpad{
  position:relative;
  width:154px;
  height:154px;
  flex:none;
}

.control{
  position:absolute;
  display:grid;
  place-items:center;
  border:2px solid #566783;
  color:#fff;
  background:linear-gradient(145deg,#465875,#202b42);
  box-shadow:0 5px 0 #0a0f1d,0 8px 14px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.16);
  font-weight:900;
  cursor:pointer;
  touch-action:none;
}

.dpad .control{
  width:52px;
  height:52px;
  border-radius:10px;
  font-size:21px;
}

.up{top:0;left:51px}
.down{bottom:0;left:51px}
.left{left:0;top:51px}
.right{right:0;top:51px}

.dpad-center{
  position:absolute;
  top:51px;
  left:51px;
  width:52px;
  height:52px;
  border-radius:8px;
  background:#202b42;
  box-shadow:inset 0 0 10px rgba(0,0,0,.35);
  pointer-events:none;
}

.right-controls{
  display:flex;
  align-items:center;
  gap:13px;
  flex:none;
  padding-right:4px;
}

.round{
  position:relative;
  width:67px;
  height:67px;
  border-radius:50%;
  font-size:20px;
  background:linear-gradient(145deg,#ff7180,#bd2548);
  border-color:#ff9eaa;
}

.round.b{
  margin-top:30px;
  background:linear-gradient(145deg,#6e9bff,#375fd7);
  border-color:#a6bfff;
}

.round::after{
  content:attr(data-label);
  position:absolute;
  top:75px;
  color:#c7d2ed;
  font-size:11px;
  font-weight:800;
}

.middle-controls{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-top:7px;
}

.middle{
  min-width:84px;
  min-height:34px;
  padding:0 13px;
  border-radius:20px;
  color:#d5def5;
  font-size:11px;
}

.hint{
  text-align:center;
  color:#8f9dbc;
  font-size:11px;
  line-height:1.45;
}

@media(max-width:390px){
  .app{
    padding:12px 10px calc(20px + env(safe-area-inset-bottom));
  }

  .brand{
    font-size:15px;
  }

  .controls{
    gap:7px;
  }

  .dpad{
    transform:scale(.9);
    transform-origin:left center;
    margin-right:-15px;
  }

  .right-controls{
    transform:scale(.9);
    transform-origin:right center;
    margin-left:-15px;
  }
}

@media(min-width:600px){
  .controls{
    padding:12px 60px 0;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div class="brand">
      <div class="brand-icon">NES</div>
      SUPER MARIO BROS
    </div>
    <div class="status" id="status">Đang tải game...</div>
  </div>

  <div class="screen-box">
    <canvas id="screen" width="256" height="240"></canvas>

    <div class="screen-message" id="screenMessage">
      <strong>Đang tải Super Mario Bros</strong>
      <span>Vui lòng chờ trong giây lát...</span>
    </div>
  </div>

  <div class="top-actions">
    <button id="pauseButton">Tạm dừng</button>
    <button id="soundButton">Âm thanh: Bật</button>
  </div>

  <div class="controls">
    <div class="dpad">
      <button class="control up" data-key="UP">▲</button>
      <button class="control down" data-key="DOWN">▼</button>
      <button class="control left" data-key="LEFT">◀</button>
      <button class="control right" data-key="RIGHT">▶</button>
      <div class="dpad-center"></div>
    </div>

    <div class="right-controls">
      <button class="control round b" data-key="B" data-label="B">B</button>
      <button class="control round a" data-key="A" data-label="A">A</button>
    </div>
  </div>

  <div class="middle-controls">
    <button class="middle" data-key="SELECT">SELECT</button>
    <button class="middle" data-key="START">START</button>
  </div>

  <div class="hint">Chạm một nút bất kỳ để bật âm thanh trên iPhone</div>

</div>

<script>
(function(){
  "use strict";

  const DEFAULT_ROM_URL="https://github.com/nhut990/files/raw/refs/heads/main/hinh/SuperMarioBros.nes";

  const canvas=document.getElementById("screen");
  const ctx=canvas.getContext("2d",{alpha:false});
  const imageData=ctx.createImageData(256,240);
  const pixels=imageData.data;

  const status=document.getElementById("status");
  const screenMessage=document.getElementById("screenMessage");
  const pauseButton=document.getElementById("pauseButton");
  const soundButton=document.getElementById("soundButton");

  if(typeof window.jsnes==="undefined"){
    status.textContent="Không tải được thư viện giả lập";
    screenMessage.style.display="flex";
    screenMessage.innerHTML="<strong>Lỗi jsnes</strong><span>Không thể tải thư viện giả lập. Hãy kiểm tra kết nối mạng rồi tải lại trang.</span>";
    return;
  }

  let nes=null;
  let gameLoaded=false;
  let paused=false;
  let soundEnabled=true;

  let audioContext=null;
  let audioNode=null;

  const AUDIO_BUFFER_SIZE=32768;
  const audioLeft=new Float32Array(AUDIO_BUFFER_SIZE);
  const audioRight=new Float32Array(AUDIO_BUFFER_SIZE);

  let audioWriteIndex=0;
  let audioReadIndex=0;

  const heldInputs={
    UP:new Set(),
    DOWN:new Set(),
    LEFT:new Set(),
    RIGHT:new Set(),
    A:new Set(),
    B:new Set(),
    SELECT:new Set(),
    START:new Set()
  };

  const buttons={
    UP:jsnes.Controller.BUTTON_UP,
    DOWN:jsnes.Controller.BUTTON_DOWN,
    LEFT:jsnes.Controller.BUTTON_LEFT,
    RIGHT:jsnes.Controller.BUTTON_RIGHT,
    A:jsnes.Controller.BUTTON_A,
    B:jsnes.Controller.BUTTON_B,
    SELECT:jsnes.Controller.BUTTON_SELECT,
    START:jsnes.Controller.BUTTON_START
  };

  const FRAME_TIME=1000/60.0988;
  const MAX_CATCHUP_FRAMES=3;

  let lastFrameTime=0;
  let frameAccumulator=0;

  function clearAudioBuffer(){
    audioWriteIndex=0;
    audioReadIndex=0;
  }

  function getAudioAvailable(){
    return (audioWriteIndex-audioReadIndex+AUDIO_BUFFER_SIZE)%AUDIO_BUFFER_SIZE;
  }

  function initAudio(){
    if(audioContext){
      if(audioContext.state==="suspended"){
        audioContext.resume().catch(function(){});
      }
      return;
    }

    const AudioContextClass=window.AudioContext||window.webkitAudioContext;

    if(!AudioContextClass) return;

    try{
      audioContext=new AudioContextClass();
      audioNode=audioContext.createScriptProcessor(2048,0,2);

      audioNode.onaudioprocess=function(event){
        const left=event.outputBuffer.getChannelData(0);
        const right=event.outputBuffer.getChannelData(1);

        for(let i=0;i<left.length;i++){
          if(soundEnabled&&audioReadIndex!==audioWriteIndex){
            left[i]=audioLeft[audioReadIndex];
            right[i]=audioRight[audioReadIndex];
            audioReadIndex=(audioReadIndex+1)%AUDIO_BUFFER_SIZE;
          }else{
            left[i]=0;
            right[i]=0;
          }
        }
      };

      audioNode.connect(audioContext.destination);

      if(audioContext.state==="suspended"){
        audioContext.resume().catch(function(){});
      }
    }catch(error){
      console.error("Không thể khởi tạo âm thanh:",error);
    }
  }

  function writeAudioSample(left,right){
    if(!soundEnabled) return;

    const nextIndex=(audioWriteIndex+1)%AUDIO_BUFFER_SIZE;

    if(nextIndex===audioReadIndex) return;

    audioLeft[audioWriteIndex]=left;
    audioRight[audioWriteIndex]=right;
    audioWriteIndex=nextIndex;
  }

  function createNES(){
    clearAudioBuffer();

    nes=new jsnes.NES({
      sampleRate:44100,

      onFrame:function(framebuffer){
        for(let i=0,p=0;i<framebuffer.length;i++,p+=4){
          const color=framebuffer[i];

          pixels[p]=(color>>16)&0xFF;
          pixels[p+1]=(color>>8)&0xFF;
          pixels[p+2]=color&0xFF;
          pixels[p+3]=255;
        }

        ctx.putImageData(imageData,0,0);
      },

      onAudioSample:function(left,right){
        writeAudioSample(left,right);
      }
    });
  }

  function binaryStringFromArrayBuffer(buffer){
    const bytes=new Uint8Array(buffer);
    const chunkSize=8192;
    let result="";

    for(let i=0;i<bytes.length;i+=chunkSize){
      result+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunkSize));
    }

    return result;
  }

  async function loadDefaultGame(){
    try{
      status.textContent="Đang tải Super Mario Bros...";
      screenMessage.style.display="flex";
      screenMessage.innerHTML="<strong>Đang tải Super Mario Bros</strong><span>Vui lòng chờ trong giây lát...</span>";

      createNES();

      const response=await fetch(DEFAULT_ROM_URL,{
        cache:"no-store"
      });

      if(!response.ok){
        throw new Error("Không tải được file game. Mã lỗi: "+response.status);
      }

      const buffer=await response.arrayBuffer();

      if(buffer.byteLength<16){
        throw new Error("File game không hợp lệ hoặc file quá nhỏ.");
      }

      const header=new Uint8Array(buffer.slice(0,4));

      if(
        header[0]!==0x4E||
        header[1]!==0x45||
        header[2]!==0x53||
        header[3]!==0x1A
      ){
        throw new Error("File tải về không phải ROM NES hợp lệ.");
      }

      nes.loadROM(binaryStringFromArrayBuffer(buffer));

      gameLoaded=true;
      paused=false;
      lastFrameTime=0;
      frameAccumulator=0;

      pauseButton.textContent="Tạm dừng";
      status.textContent="Super Mario Bros đã sẵn sàng";
      screenMessage.style.display="none";
    }catch(error){
      console.error(error);

      gameLoaded=false;
      status.textContent="Không thể tải game";
      screenMessage.style.display="flex";
      screenMessage.innerHTML="<strong>Không thể tải game</strong><span>"+(error.message||"Vui lòng kiểm tra lại link ROM và kết nối mạng.")+"</span>";
    }
  }

  function gameLoop(time){
    requestAnimationFrame(gameLoop);

    if(!gameLoaded||paused||!nes){
      lastFrameTime=time;
      return;
    }

    if(!lastFrameTime){
      lastFrameTime=time;
      return;
    }

    let delta=time-lastFrameTime;
    lastFrameTime=time;

    if(delta>250) delta=250;
    if(delta<0) delta=0;

    frameAccumulator+=delta;

    let framesRun=0;

    while(frameAccumulator>=FRAME_TIME&&framesRun<MAX_CATCHUP_FRAMES){
      nes.frame();
      frameAccumulator-=FRAME_TIME;
      framesRun++;
    }
  }

  function updateButtonVisual(key){
    const element=document.querySelector('[data-key="'+key+'"]');

    if(!element) return;

    element.classList.toggle("pressed",heldInputs[key].size>0);
  }

  function setButton(key,source,isDown){
    if(!Object.prototype.hasOwnProperty.call(buttons,key)) return;

    const sources=heldInputs[key];
    const wasPressed=sources.size>0;

    if(isDown){
      sources.add(source);
    }else{
      sources.delete(source);
    }

    const isPressed=sources.size>0;

    updateButtonVisual(key);

    if(!gameLoaded||!nes||wasPressed===isPressed) return;

    initAudio();

    if(isPressed){
      nes.buttonDown(1,buttons[key]);
    }else{
      nes.buttonUp(1,buttons[key]);
    }
  }

  function releaseAllButtons(){
    Object.keys(buttons).forEach(function(key){
      heldInputs[key].clear();

      if(nes){
        nes.buttonUp(1,buttons[key]);
      }

      updateButtonVisual(key);
    });
  }

  pauseButton.addEventListener("click",function(){
    if(!gameLoaded) return;

    paused=!paused;
    pauseButton.textContent=paused?"Tiếp tục":"Tạm dừng";
    status.textContent=paused?"Game đang tạm dừng":"Đang chơi";

    lastFrameTime=0;
    frameAccumulator=0;

    releaseAllButtons();
  });

  soundButton.addEventListener("click",function(){
    soundEnabled=!soundEnabled;
    clearAudioBuffer();

    soundButton.textContent="Âm thanh: "+(soundEnabled?"Bật":"Tắt");

    if(soundEnabled){
      initAudio();
    }
  });

  document.querySelectorAll("[data-key]").forEach(function(button){
    const key=button.dataset.key;

    function getSource(event){
      return "pointer-"+event.pointerId;
    }

    function press(event){
      event.preventDefault();

      initAudio();
      setButton(key,getSource(event),true);

      try{
        button.setPointerCapture(event.pointerId);
      }catch(error){}
    }

    function release(event){
      event.preventDefault();
      setButton(key,getSource(event),false);
    }

    button.addEventListener("pointerdown",press);
    button.addEventListener("pointerup",release);
    button.addEventListener("pointercancel",release);
    button.addEventListener("lostpointercapture",release);
  });

  const keyboardMap={
    ArrowUp:"UP",
    ArrowDown:"DOWN",
    ArrowLeft:"LEFT",
    ArrowRight:"RIGHT",
    z:"A",
    Z:"A",
    x:"B",
    X:"B",
    Enter:"START",
    Shift:"SELECT"
  };

  window.addEventListener("keydown",function(event){
    const key=keyboardMap[event.key];

    if(!key||event.repeat) return;

    event.preventDefault();
    initAudio();
    setButton(key,"keyboard-"+event.code,true);
  });

  window.addEventListener("keyup",function(event){
    const key=keyboardMap[event.key];

    if(!key) return;

    event.preventDefault();
    setButton(key,"keyboard-"+event.code,false);
  });

  window.addEventListener("blur",function(){
    releaseAllButtons();
  });

  document.addEventListener("visibilitychange",function(){
    if(document.hidden){
      releaseAllButtons();
      clearAudioBuffer();
      lastFrameTime=0;
      frameAccumulator=0;
    }
  });

  document.body.addEventListener("pointerdown",function(){
    initAudio();
  },{passive:true});

  requestAnimationFrame(gameLoop);
  loadDefaultGame();
})();
</script>
</body>
</html>
