<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>NES Emulator</title>
  <script src="https://cdn.jsdelivr.net/npm/jsnes@1.2.1/dist/jsnes.js"></script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
    :root{--text:#eef3ff;--muted:#9ba9ca;--border:#3b4c73;}
    html,body{overscroll-behavior:none;}
    body{margin:0;width:100%;height:100vh;height:100dvh;overflow:hidden;color:var(--text);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#293965 0%,#11192f 44%,#070b15 100%);touch-action:none;}
    .app{position:relative;width:min(100%,760px);height:100vh;height:100dvh;margin:auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:10px;}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;font-size:clamp(14px,3vw,18px);font-weight:800;letter-spacing:.5px;}
    .brand-icon{display:grid;place-items:center;width:clamp(34px,7vw,40px);height:clamp(23px,5vw,27px);flex:none;border:2px solid #fff;border-radius:8px;background:linear-gradient(145deg,#ff6578,#bc2447);box-shadow:0 4px 10px rgba(0,0,0,.3);font-size:clamp(10px,2vw,12px);}
    .brand-name,.status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .status{max-width:52%;color:var(--muted);font-size:clamp(10px,2vw,12px);text-align:right;}
    .screen-box{position:relative;width:100%;min-height:0;max-height:42vh;flex:1 1 auto;overflow:hidden;border:5px solid #394866;border-radius:16px;background:#000;aspect-ratio:4 / 3;box-shadow:0 15px 35px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.05);}
    canvas{display:block;width:100%;height:100%;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;}
    .screen-message{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:radial-gradient(circle,rgba(35,49,84,.92),rgba(5,8,16,.97));}
    .screen-message strong{font-size:clamp(16px,4vw,20px)}
    .screen-message span{color:#b0bddc;font-size:clamp(11px,2.5vw,13px);line-height:1.5;}
    .top-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none;}
    button{min-height:clamp(38px,8vh,46px);padding:0 8px;border:1px solid var(--border);border-radius:12px;color:var(--text);background:linear-gradient(145deg,#293756,#151d31);box-shadow:0 4px 0 #080c16,0 7px 14px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.12);font:inherit;font-size:clamp(11px,2.5vw,14px);font-weight:700;cursor:pointer;white-space:nowrap;touch-action:none;}
    button:active,.control.pressed,.middle.pressed{transform:translateY(3px) scale(.98);box-shadow:0 1px 0 #080c16,inset 0 2px 8px rgba(0,0,0,.42);filter:brightness(.88);}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:0;flex:1 1 auto;padding:4px 2px 0;}
    .dpad{position:relative;width:clamp(135px,29vw,150px);height:clamp(135px,29vw,150px);flex:none;filter:drop-shadow(0 10px 12px rgba(0,0,0,.34));}
    .control{position:absolute;display:grid;place-items:center;border:2px solid #566783;color:#fff;background:linear-gradient(145deg,#465875,#202b42);box-shadow:0 5px 0 #0a0f1d,0 8px 14px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.16);font-weight:900;cursor:pointer;touch-action:none;}
    .dpad .control{z-index:2;width:38%;height:38%;min-height:0;padding:0;border:2px solid #6f82a6;border-radius:11px;background:linear-gradient(145deg,#4e6387,#293954 46%,#18243b);box-shadow:0 5px 0 #070d19,0 9px 15px rgba(0,0,0,.34),inset 0 2px 1px rgba(255,255,255,.2),inset 0 -3px 5px rgba(0,0,0,.25);}
    .dpad .up{top:0;left:31%;border-radius:12px 12px 5px 5px}
    .dpad .down{bottom:0;left:31%;border-radius:5px 5px 12px 12px}
    .dpad .left{top:31%;left:0;border-radius:12px 5px 5px 12px}
    .dpad .right{top:31%;right:0;border-radius:5px 12px 12px 5px}
    .dpad-center{position:absolute;z-index:3;top:31%;left:31%;width:38%;height:38%;border:2px solid #627695;border-radius:5px;pointer-events:none;background:radial-gradient(circle at 35% 28%,#526786,#34445f 42%,#1a263c);}
    .dpad-arrow{width:48%;height:48%;fill:#f5f8ff;filter:drop-shadow(0 2px 1px rgba(0,0,0,.55));}
    .dpad .control.pressed{z-index:4;border-color:#a9c7ff;background:linear-gradient(145deg,#293b59,#172238);box-shadow:0 2px 0 #070d19,inset 0 3px 8px rgba(0,0,0,.48),0 0 12px rgba(112,164,255,.3);}
    .right-controls{display:flex;align-items:center;gap:clamp(10px,2.5vw,14px);flex:none;padding-right:2px;}
    .round{position:relative;width:clamp(58px,14vw,68px);height:clamp(58px,14vw,68px);min-height:0;padding:0;border-radius:50%;font-size:clamp(17px,5vw,24px);background:linear-gradient(145deg,#ff7180,#bd2548);border-color:#ff9eaa;}
    .round.b{margin-top:clamp(23px,5vw,31px);background:linear-gradient(145deg,#6e9bff,#375fd7);border-color:#a6bfff;}
    .round::after{content:attr(data-label);position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);color:#c7d2ed;font-size:clamp(9px,2.3vw,11px);font-weight:800;}
    .middle-controls{display:flex;justify-content:center;gap:12px;flex:none;margin-top:4px;}
    .middle{position:relative;min-width:clamp(70px,20vw,90px);min-height:clamp(32px,7vh,38px);padding:0 12px;border-radius:20px;color:#d5def5;font-size:clamp(11px,2.5vw,13px);}
    .landscape-menu-button{display:none;position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:38px;min-height:38px;padding:0;border-radius:50%;font-size:18px;}
    .game-modal{position:fixed;z-index:100;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,5,13,.75);backdrop-filter:blur(7px);}
    .game-modal.show{display:flex}
    .game-modal-card{width:min(100%,455px);max-height:calc(100dvh - 36px);overflow:auto;border:1px solid rgba(142,172,240,.42);border-radius:19px;background:linear-gradient(145deg,#26385f,#111a2e);}
    .game-modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px;border-bottom:1px solid rgba(153,183,245,.2);}
    .game-modal-header strong{font-size:16px}
    .game-modal-header span{display:block;margin-top:5px;color:#aab9d8;font-size:11px;}
    .close-game-modal{width:36px;min-height:36px;padding:0;border-radius:50%;font-size:17px;}
    .game-list{display:flex;flex-direction:column;gap:10px;padding:14px;}
    .game-item{display:flex;align-items:center;gap:13px;width:100%;min-height:70px;padding:10px 12px;border:1px solid rgba(143,178,248,.3);border-radius:13px;color:#eff4ff;text-align:left;background:linear-gradient(145deg,#334b78,#1a2742);}
    .local-game{background:linear-gradient(145deg,#576183,#2b3450)}
    .game-icon,.game-cover{width:43px;height:43px;flex:none;border-radius:11px;}
    .game-icon{display:grid;place-items:center;background:rgba(8,14,29,.42);font-size:23px;}
    .game-cover{object-fit:cover;border:1px solid rgba(255,255,255,.18);background:#0b1222;}
    .game-info{min-width:0}
    .game-info strong,.game-info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .game-info strong{font-size:14px}
    .game-info small{margin-top:5px;color:#b5c4e1;font-size:11px;}
    .game-ready{color:#8ff3b7!important}
    @media (orientation:landscape) and (max-height:600px){
      .app{width:100%;max-width:none;height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:grid;grid-template-columns:minmax(105px,23vw) minmax(210px,4fr) minmax(105px,23vw);grid-template-rows:minmax(0,1fr) auto;align-items:center;column-gap:clamp(10px,3vw,32px);}
      .header,.top-actions{display:none}
      .landscape-menu-button{display:grid;place-items:center}
      .screen-box{grid-column:2;grid-row:1;width:100%;height:auto;max-width:min(66vw,calc((100dvh - 65px) * 4 / 3));max-height:calc(100dvh - 65px);margin:auto;border-width:4px;}
      .controls{display:contents}
      .dpad{grid-column:1;grid-row:1;justify-self:center;width:clamp(105px,20vw,160px);height:clamp(105px,20vw,160px);transform:translateY(clamp(44px,10vh,62px));}
      .right-controls{grid-column:3;grid-row:1;justify-self:center;gap:clamp(7px,1.8vw,15px);transform:translateY(clamp(44px,10vh,62px));}
      .round{width:clamp(55px,11vw,82px);height:clamp(55px,11vw,82px);}
      .middle-controls{grid-column:2;grid-row:2;margin:0;transform:translateY(8px);}
      .middle{min-width:68px;min-height:30px;}
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="brand"><div class="brand-icon">NES</div><span class="brand-name" id="gameTitle">SUPER MARIO BROS</span></div>
      <div class="status" id="status">Đang chuẩn bị...</div>
    </div>
    <div class="screen-box">
      <canvas id="screen" width="256" height="240"></canvas>
      <div class="screen-message" id="screenMessage"><strong>Đang tải Super Mario Bros</strong><span>Vui lòng chờ trong giây lát...</span></div>
    </div>
    <div class="top-actions"><button id="pauseButton">Tạm dừng</button><button id="soundButton">Âm thanh: Bật</button><button id="gameButton">Game khác</button></div>
    <div class="controls">
      <div class="dpad">
        <button class="control up" data-key="UP" aria-label="Lên"><svg class="dpad-arrow" viewBox="0 0 24 24"><path d="M12 4L4.5 12H9v8h6v-8h4.5L12 4z"/></svg></button>
        <button class="control down" data-key="DOWN" aria-label="Xuống"><svg class="dpad-arrow" viewBox="0 0 24 24"><path d="M12 20l7.5-8H15V4H9v8H4.5l7.5 8z"/></svg></button>
        <button class="control left" data-key="LEFT" aria-label="Trái"><svg class="dpad-arrow" viewBox="0 0 24 24"><path d="M4 12l8-7.5V9h8v6h-8v4.5L4 12z"/></svg></button>
        <button class="control right" data-key="RIGHT" aria-label="Phải"><svg class="dpad-arrow" viewBox="0 0 24 24"><path d="M20 12l-8 7.5V15H4V9h8V4.5l8 7.5z"/></svg></button>
        <div class="dpad-center"></div>
      </div>
      <div class="right-controls"><button class="control round b" data-key="B" data-label="B">B</button><button class="control round a" data-key="A" data-label="A">A</button></div>
    </div>
    <div class="middle-controls"><button class="middle" data-key="SELECT">SELECT</button><button class="middle" data-key="START">START</button></div>
  </div>
  <button id="landscapeMenuButton" class="landscape-menu-button" aria-label="Mở menu game">☰</button>
  <input type="file" id="fileInput" accept=".nes" hidden>
  <div class="game-modal" id="gameModal">
    <div class="game-modal-card">
      <div class="game-modal-header"><div><strong>GAME KHÁC</strong><span>Mở ROM từ máy hoặc chọn game có sẵn</span></div><button id="closeGameModal" class="close-game-modal">✕</button></div>
      <div class="game-list">
        <button class="game-item local-game" id="openFileButton"><span class="game-icon">📁</span><span class="game-info"><strong>Mở file .nes từ máy</strong><small>Chọn ROM NES trong điện thoại hoặc máy tính</small></span></button>
        <button class="game-item" id="adventureButton"><img class="game-cover" src="https://raw.githubusercontent.com/nhut990/files/refs/heads/main/hinh/Adventure%20Island.jpg" alt="Adventure Island"><span class="game-info"><strong>Adventure Island</strong><small id="adventureStatus">Đang tải sẵn game...</small></span></button>
        <button class="game-item" id="contra2Button"><img class="game-cover" src="https://raw.githubusercontent.com/nhut990/files/refs/heads/main/hinh/Contra2.jpg" alt="Contra 2"><span class="game-info"><strong>Contra 2</strong><small id="contra2Status">Đang tải sẵn game...</small></span></button>
        <button class="game-item" id="chessButton"><img class="game-cover" src="https://raw.githubusercontent.com/nhut990/files/refs/heads/main/hinh/Chinese%20Chess.jpg" alt="Chinese Chess"><span class="game-info"><strong>Zhong Guo Xiang Qi (Chinese Chess)</strong><small id="chessStatus">Đang tải sẵn game...</small></span></button>
      </div>
    </div>
  </div>

  <script>
    const GAMES = {
      mario:{name:"Super Mario Bros",url:"https://raw.githubusercontent.com/nhut990/files/main/hinh/SuperMarioBros.nes"},
      adventure:{name:"Adventure Island",url:"https://raw.githubusercontent.com/nhut990/files/main/music/Adventure%20Island%20(USA).nes"},
      contra2:{name:"Contra 2",url:"https://raw.githubusercontent.com/nhut990/files/main/music/Contra%202.nes"},
      chess:{name:"Zhong Guo Xiang Qi (Chinese Chess)",url:"https://raw.githubusercontent.com/nhut990/files/main/music/Zhong%20Guo%20Xiang%20Qi%20(Chinese%20Chess).nes"}
    };

    const NES_SAMPLE_RATE=44100,NES_FPS=60.0988,AUDIO_BUFFER_FRAMES=32768,AUDIO_PREROLL_FRAMES=4096;
    const audioLeft=new Float32Array(AUDIO_BUFFER_FRAMES),audioRight=new Float32Array(AUDIO_BUFFER_FRAMES);
    let audioReadIndex=0,audioWriteIndex=0,audioFrameCount=0,audioPrimed=false,resampleFraction=0,audioContext=null,audioNode=null,soundEnabled=true;
    const canvas=document.getElementById("screen"),ctx=canvas.getContext("2d",{alpha:false}),imageData=ctx.createImageData(256,240),pixels=imageData.data;
    const status=document.getElementById("status"),gameTitle=document.getElementById("gameTitle"),screenMessage=document.getElementById("screenMessage");
    const pauseButton=document.getElementById("pauseButton"),soundButton=document.getElementById("soundButton"),gameButton=document.getElementById("gameButton");
    const landscapeMenuButton=document.getElementById("landscapeMenuButton"),gameModal=document.getElementById("gameModal"),closeGameModal=document.getElementById("closeGameModal");
    const openFileButton=document.getElementById("openFileButton"),fileInput=document.getElementById("fileInput");
    const preloadStatus={adventure:document.getElementById("adventureStatus"),contra2:document.getElementById("contra2Status"),chess:document.getElementById("chessStatus")};

    const keys={
      UP:jsnes.Controller.BUTTON_UP,DOWN:jsnes.Controller.BUTTON_DOWN,LEFT:jsnes.Controller.BUTTON_LEFT,RIGHT:jsnes.Controller.BUTTON_RIGHT,
      A:jsnes.Controller.BUTTON_A,B:jsnes.Controller.BUTTON_B,SELECT:jsnes.Controller.BUTTON_SELECT,START:jsnes.Controller.BUTTON_START
    };

    let nes=null,gameLoaded=false,paused=false,loadToken=0,gameClock=0,frameAccumulator=0;
    const romCache={},romPromises={};
    const activeSources={};
    Object.keys(keys).forEach(key=>activeSources[key]=new Set());

    function showMessage(title,text){screenMessage.style.display="flex";screenMessage.innerHTML="";const s=document.createElement("strong");s.textContent=title;const sp=document.createElement("span");sp.textContent=text;screenMessage.append(s,sp);}
    function hideMessage(){screenMessage.style.display="none";}
    function clearAudioBuffer(){audioReadIndex=0;audioWriteIndex=0;audioFrameCount=0;audioPrimed=false;resampleFraction=0;}
    function writeAudioFrame(left,right){if(!soundEnabled||audioFrameCount>=AUDIO_BUFFER_FRAMES)return;audioLeft[audioWriteIndex]=left;audioRight[audioWriteIndex]=right;audioWriteIndex=(audioWriteIndex+1)%AUDIO_BUFFER_FRAMES;audioFrameCount++;}
    function discardAudioFrames(count){const a=Math.min(count,audioFrameCount);audioReadIndex=(audioReadIndex+a)%AUDIO_BUFFER_FRAMES;audioFrameCount-=a;}

    async function ensureAudio(){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
      if(!audioContext){
        audioContext=new AC();
        audioNode=audioContext.createScriptProcessor(2048,0,2);
        audioNode.onaudioprocess=function(e){
          const L=e.outputBuffer.getChannelData(0),R=e.outputBuffer.getChannelData(1);
          if(!soundEnabled||audioContext.state!=="running"){L.fill(0);R.fill(0);return;}
          if(!audioPrimed){if(audioFrameCount>=AUDIO_PREROLL_FRAMES)audioPrimed=true;else{L.fill(0);R.fill(0);return;}}
          const ratio=NES_SAMPLE_RATE/audioContext.sampleRate;
          for(let i=0;i<L.length;i++){
            if(audioFrameCount<2){L[i]=R[i]=0;audioPrimed=false;continue;}
            const idxA=audioReadIndex,idxB=(audioReadIndex+1)%AUDIO_BUFFER_FRAMES;
            L[i]=audioLeft[idxA]+(audioLeft[idxB]-audioLeft[idxA])*resampleFraction;
            R[i]=audioRight[idxA]+(audioRight[idxB]-audioRight[idxA])*resampleFraction;
            resampleFraction+=ratio;const d=Math.floor(resampleFraction);
            if(d>0){discardAudioFrames(d);resampleFraction-=d;}
          }
        };
        audioNode.connect(audioContext.destination);
      }
      try{if(audioContext.state!=="running"){clearAudioBuffer();await audioContext.resume();clearAudioBuffer();}return true;}
      catch(e){console.warn("Audio lỗi:",e);return false;}
    }

    function validRom(b){return b.byteLength>=16&&new Uint8Array(b)[0]===0x4e&&new Uint8Array(b)[1]===0x45&&new Uint8Array(b)[2]===0x53&&new Uint8Array(b)[3]===0x1a;}
    function toBinary(b){const u=new Uint8Array(b);let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return s;}
    function createNes(){clearAudioBuffer();nes=new jsnes.NES({sampleRate:NES_SAMPLE_RATE,preferredFrameRate:NES_FPS,onFrame(f){for(let i=0,p=0;i<f.length;i++,p+=4){const c=f[i];pixels[p]=c&255;pixels[p+1]=(c>>8)&255;pixels[p+2]=(c>>16)&255;pixels[p+3]=255;}ctx.putImageData(imageData,0,0);},onAudioSample(l,r){writeAudioFrame(l,r);}});}
    function updateKeyVisual(k){const p=activeSources[k].size>0;document.querySelectorAll(`[data-key="${k}"]`).forEach(b=>b.classList.toggle("pressed",p));}
    function setVirtualKey(key,sourceId,isDown){
      if(!(key in keys))return;
      const src=activeSources[key],wasPressed=src.size>0;
      isDown?src.add(sourceId):src.delete(sourceId);
      const isPressed=src.size>0;
      if(!wasPressed&&isPressed){if(gameLoaded&&nes){ensureAudio();nes.buttonDown(1,keys[key]);}}
      if(wasPressed&&!isPressed&&nes)nes.buttonUp(1,keys[key]);
      updateKeyVisual(key);
    }

    // ===================================================
    // PHẦN ĐIỀU KHIỂN — ĐÃ SỬA LỖI NÚT BẤM KHÔNG HOẠT ĐỘNG
    // ===================================================
    const activeTouches = new Map(); // touchId → key
    const activePointers = new Map(); // pointerId → key

    // Chặn hành vi mặc định nhưng KHÔNG ngăn sự kiện đến nút
    document.addEventListener('touchstart', e => {
      if (e.target.closest('[data-key]')) {
        e.preventDefault(); // chỉ chặn cuộn/zoom, không ngăn bấm nút
      }
    }, { passive: false });

    document.addEventListener('touchmove', e => {
      if (e.target.closest('[data-key]') || activeTouches.size > 0) {
        e.preventDefault();
      }
    }, { passive: false });

    function releaseAllControls() {
      activeTouches.clear();
      activePointers.clear();
      Object.keys(activeSources).forEach(key => {
        if (activeSources[key].size > 0) {
          activeSources[key].clear();
          nes?.buttonUp(1, keys[key]);
          updateKeyVisual(key);
        }
      });
      document.querySelectorAll('[data-key]').forEach(b => b.classList.remove('pressed'));
    }

    // Gắn sự kiện cho TẤT CẢ nút điều khiển
    document.querySelectorAll('[data-key]').forEach(btn => {
      const key = btn.dataset.key;

      // === Touch Events (chính trên iPhone) ===
      btn.addEventListener('touchstart', e => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          activeTouches.set(t.identifier, key);
          setVirtualKey(key, `touch:${t.identifier}`, true);
          btn.classList.add('pressed');
        }
      }, { passive: false });

      btn.addEventListener('touchend', e => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (activeTouches.has(t.identifier)) {
            const k = activeTouches.get(t.identifier);
            activeTouches.delete(t.identifier);
            setVirtualKey(k, `touch:${t.identifier}`, false);
            btn.classList.remove('pressed');
          }
        }
      }, { passive: false });

      btn.addEventListener('touchcancel', e => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (activeTouches.has(t.identifier)) {
            const k = activeTouches.get(t.identifier);
            activeTouches.delete(t.identifier);
            setVirtualKey(k, `touch:${t.identifier}`, false);
            btn.classList.remove('pressed');
          }
        }
      }, { passive: false });

      // === Pointer Events (chỉ cho chuột/bút — bỏ qua touch) ===
      btn.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') return;
        activePointers.set(e.pointerId, key);
        setVirtualKey(key, `pointer:${e.pointerId}`, true);
        btn.classList.add('pressed');
        try { btn.setPointerCapture(e.pointerId); } catch {}
      });

      btn.addEventListener('pointerup', e => {
        if (e.pointerType === 'touch') return;
        if (activePointers.has(e.pointerId)) {
          const k = activePointers.get(e.pointerId);
          activePointers.delete(e.pointerId);
          setVirtualKey(k, `pointer:${e.pointerId}`, false);
          btn.classList.remove('pressed');
        }
      });

      btn.addEventListener('pointercancel', e => {
        if (e.pointerType === 'touch') return;
        if (activePointers.has(e.pointerId)) {
          const k = activePointers.get(e.pointerId);
          activePointers.delete(e.pointerId);
          setVirtualKey(k, `pointer:${e.pointerId}`, false);
          btn.classList.remove('pressed');
        }
      });

      btn.addEventListener('contextmenu', e => e.preventDefault());
    });

    // === Nhả tất cả khi mất trọng tâm ===
    window.addEventListener('blur', releaseAllControls);
    window.addEventListener('pagehide', releaseAllControls);
    window.addEventListener('orientationchange', releaseAllControls);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        releaseAllControls();
        clearAudioBuffer();
        if (gameLoaded && !paused) { paused = true; pauseButton.textContent = 'Tiếp tục'; status.textContent = 'Game đang tạm dừng'; }
      }
    });

    // === Bàn phím ===
    const keyboardMap = {ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',z:'A',Z:'A',x:'B',X:'B',Enter:'START',Shift:'SELECT'};
    window.addEventListener('keydown', e => {const k=keyboardMap[e.key];if(!k||e.repeat)return;e.preventDefault();setVirtualKey(k,`key:${e.code}`,true);});
    window.addEventListener('keyup', e => {const k=keyboardMap[e.key];if(!k)return;e.preventDefault();setVirtualKey(k,`key:${e.code}`,false);});

    // === Nút chức năng ===
    pauseButton.addEventListener('click', () => {
      if(!gameLoaded)return;paused=!paused;clearAudioBuffer();releaseAllControls();
      pauseButton.textContent=paused?'Tiếp tục':'Tạm dừng';status.textContent=paused?'Game đang tạm dừng':'Đang chơi';
      gameClock=performance.now();frameAccumulator=0;
    });
    soundButton.addEventListener('click', async () => {soundEnabled=!soundEnabled;clearAudioBuffer();soundButton.textContent='Âm thanh: '+(soundEnabled?'Bật':'Tắt');if(soundEnabled)await ensureAudio();});
    function openMenu(){releaseAllControls();gameModal.classList.add('show');}
    gameButton.addEventListener('click',openMenu);landscapeMenuButton.addEventListener('click',openMenu);
    closeGameModal.addEventListener('click',()=>gameModal.classList.remove('show'));
    gameModal.addEventListener('click',e=>{if(e.target===gameModal)gameModal.classList.remove('show');});
    openFileButton.addEventListener('click',()=>{gameModal.classList.remove('show');fileInput.click();});
    document.getElementById('adventureButton').addEventListener('click',()=>{gameModal.classList.remove('show');loadGame('adventure');});
    document.getElementById('contra2Button').addEventListener('click',()=>{gameModal.classList.remove('show');loadGame('contra2');});
    document.getElementById('chessButton').addEventListener('click',()=>{gameModal.classList.remove('show');loadGame('chess');});
    fileInput.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;loadLocalRom(f);fileInput.value='';});

    // === Tải game ===
    async function downloadRom(url){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('Tải lỗi: '+r.status);const b=await r.arrayBuffer();if(!validRom(b))throw new Error('ROM không hợp lệ');return b;}
    async function preloadGame(id){if(romCache[id])return romCache[id];if(romPromises[id])return romPromises[id];const g=GAMES[id],el=preloadStatus[id];if(el){el.textContent='Đang tải sẵn...';el.classList.remove('game-ready');}romPromises[id]=downloadRom(g.url).then(buf=>{romCache[id]=buf;if(el){el.textContent='Đã sẵn sàng';el.classList.add('game-ready');}return buf;}).catch(err=>{romPromises[id]=null;if(el){el.textContent='Tải thất bại';el.classList.remove('game-ready');}throw err;});return romPromises[id];}
    function loadBuffer(buf,name){if(!validRom(buf))throw new Error('ROM không hợp lệ');releaseAllControls();clearAudioBuffer();gameLoaded=false;paused=false;createNes();nes.loadROM(toBinary(buf));gameLoaded=true;gameClock=performance.now();frameAccumulator=0;pauseButton.textContent='Tạm dừng';gameTitle.textContent=name.toUpperCase();status.textContent='Đang chơi: '+name;hideMessage();}
    async function loadGame(id){const token=++loadToken;const g=GAMES[id];try{releaseAllControls();clearAudioBuffer();gameLoaded=false;paused=false;gameTitle.textContent=g.name.toUpperCase();status.textContent='Đang tải '+g.name+'...';showMessage('Đang tải',g.name);const buf=romCache[id]||await preloadGame(id);if(token!==loadToken)return;loadBuffer(buf,g.name);}catch(e){if(token!==loadToken)return;gameLoaded=false;clearAudioBuffer();status.textContent='Tải thất bại';showMessage('Lỗi',e.message||'Kiểm tra mạng rồi thử lại.');}}
    function loadLocalRom(file){const token=++loadToken;const name=file.name.replace(/\.nes$/i,'');const r=new FileReader();releaseAllControls();clearAudioBuffer();gameLoaded=false;paused=false;gameTitle.textContent=name.toUpperCase();status.textContent='Đọc file...';showMessage('Đang mở',name);r.onload=function(){if(token!==loadToken)return;try{loadBuffer(r.result,name);}catch(e){status.textContent='Lỗi mở file';showMessage('Lỗi',e.message||'File không hợp lệ.');}};r.onerror=()=>{if(token!==loadToken)return;status.textContent='Lỗi đọc file';showMessage('Lỗi','Không đọc được file.');};r.readAsArrayBuffer(file);}
    function gameLoop(now){if(!gameClock)gameClock=now;const el=Math.min(now-gameClock,100);gameClock=now;if(gameLoaded&&!paused&&nes){frameAccumulator+=el;const fd=1000/NES_FPS;let f=0;while(frameAccumulator>=fd&&f<4){nes.frame();frameAccumulator-=fd;f++;}if(f===4)frameAccumulator=0;}requestAnimationFrame(gameLoop);}

    // === Khởi động ===
    if(typeof jsnes==='undefined'){status.textContent='Không tải được jsnes';showMessage('Lỗi thư viện','Kiểm tra mạng rồi tải lại trang.');}
    else{requestAnimationFrame(gameLoop);loadGame('mario');preloadGame('adventure').catch(()=>{});preloadGame('contra2').catch(()=>{});preloadGame('chess').catch(()=>{});}
  </script>
</body>
</html>
