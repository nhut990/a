<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101217">
<title>Camera Thời Gian & Vị Trí</title>

<style>
:root{
  --bg:#101217;
  --panel:#1b1f28;
  --panel2:#252b37;
  --line:rgba(255,255,255,.13);
  --text:#f8f9ff;
  --muted:#b8c0cf;
  --blue:#4d91ff;
  --red:#ff5b63;
  --green:#36d98c;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overscroll-behavior:none;
}

.app{
  width:min(100%,850px);
  min-height:100dvh;
  margin:auto;
  padding:
    calc(12px + env(safe-area-inset-top))
    12px
    calc(18px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:12px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(145deg,#4d91ff,#254eaf);
  border:1px solid rgba(255,255,255,.3);
  box-shadow:0 6px 18px rgba(0,0,0,.3);
  font-size:21px;
}

.brand-text{
  min-width:0;
}

.brand-text b{
  display:block;
  font-size:15px;
  letter-spacing:.3px;
}

.brand-text span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.gps-status{
  font-size:11px;
  font-weight:bold;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:20px;
  color:#ffd98b;
  background:rgba(255,190,80,.08);
  white-space:nowrap;
}

.gps-status.ok{
  color:#86f1bb;
  background:rgba(54,217,140,.1);
}

.camera-box{
  position:relative;
  width:100%;
  flex:1;
  min-height:300px;
  overflow:hidden;
  border-radius:20px;
  background:#000;
  border:2px solid #303846;
  box-shadow:0 13px 35px rgba(0,0,0,.38);
}

#camera{
  display:block;
  width:100%;
  height:100%;
  min-height:300px;
  object-fit:cover;
  background:#000;
}

.camera-grid{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.3;
  background:
    linear-gradient(to right,
      transparent 33.1%, rgba(255,255,255,.75) 33.3%, transparent 33.6%,
      transparent 66.4%, rgba(255,255,255,.75) 66.6%, transparent 66.9%
    ),
    linear-gradient(to bottom,
      transparent 33.1%, rgba(255,255,255,.75) 33.3%, transparent 33.6%,
      transparent 66.4%, rgba(255,255,255,.75) 66.6%, transparent 66.9%
    );
}

.live-stamp{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  padding:11px 12px;
  border-radius:10px;
  color:white;
  background:rgba(0,0,0,.64);
  border-left:4px solid #ffc438;
  backdrop-filter:blur(5px);
  text-shadow:0 1px 2px #000;
  pointer-events:none;
}

.live-time{
  font-size:16px;
  font-weight:900;
  letter-spacing:.3px;
}

.live-info{
  margin-top:5px;
  font-size:11px;
  line-height:1.35;
  color:#f0f3ff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.no-camera{
  position:absolute;
  z-index:2;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:20px;
  text-align:center;
  background:radial-gradient(circle at center,#28334a,#090b0f 70%);
}

.no-camera.hidden{
  display:none;
}

.no-camera strong{
  font-size:17px;
}

.no-camera p{
  margin:0;
  max-width:370px;
  color:#c1cada;
  font-size:12px;
  line-height:1.5;
}

.action-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
}

.round-button{
  border:0;
  cursor:pointer;
  color:white;
  font-weight:bold;
}

.switch-camera{
  width:49px;
  height:49px;
  border-radius:50%;
  background:#273041;
  border:1px solid rgba(255,255,255,.14);
  font-size:21px;
}

.capture-button{
  position:relative;
  width:78px;
  height:78px;
  border-radius:50%;
  background:white;
  border:6px solid #dbe2ee;
  box-shadow:0 4px 16px rgba(0,0,0,.35);
}

.capture-button:after{
  content:"";
  position:absolute;
  inset:7px;
  border-radius:50%;
  border:2px solid #8792a6;
}

.capture-button:active{
  transform:scale(.92);
}

.gallery-button{
  width:49px;
  height:49px;
  border-radius:50%;
  background:#273041;
  border:1px solid rgba(255,255,255,.14);
  font-size:19px;
}

.controls{
  padding:13px;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--panel);
}

.control-title{
  margin:0 0 10px;
  color:#dce5f5;
  font-size:12px;
  font-weight:bold;
}

.mode-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.mode{
  min-height:42px;
  padding:7px 9px;
  border:1px solid #3b4556;
  border-radius:10px;
  color:#ced7e6;
  background:#222834;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.mode.active{
  color:white;
  background:linear-gradient(145deg,#4d91ff,#2f5dbc);
  border-color:#88b6ff;
  box-shadow:0 4px 12px rgba(49,103,207,.32);
}

.extra-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid var(--line);
}

.toggle-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  color:#c8d1e0;
  font-size:11px;
  font-weight:bold;
}

.toggle-wrap input{
  display:none;
}

.toggle{
  width:40px;
  height:22px;
  position:relative;
  display:block;
  border-radius:99px;
  background:#5b6575;
  cursor:pointer;
  transition:.2s;
}

.toggle:after{
  content:"";
  position:absolute;
  width:16px;
  height:16px;
  left:3px;
  top:3px;
  border-radius:50%;
  background:white;
  transition:.2s;
}

.toggle-wrap input:checked + .toggle{
  background:var(--green);
}

.toggle-wrap input:checked + .toggle:after{
  transform:translateX(18px);
}

.color-select{
  padding:7px 8px;
  border-radius:8px;
  border:1px solid #475266;
  color:white;
  background:#252d3a;
  outline:none;
  font-size:11px;
}

#result-box{
  display:none;
  position:fixed;
  z-index:99;
  inset:0;
  padding:
    calc(15px + env(safe-area-inset-top))
    15px
    calc(15px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.92);
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
}

#result-box.show{
  display:flex;
}

#result-image{
  max-width:100%;
  max-height:72dvh;
  border-radius:12px;
  border:1px solid #4c5667;
  box-shadow:0 10px 35px rgba(0,0,0,.6);
}

.result-actions{
  display:flex;
  width:min(100%,420px);
  gap:10px;
}

.result-actions button,
.result-actions a{
  flex:1;
  min-height:47px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  border:1px solid #526079;
  color:white;
  background:#263042;
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.result-actions a{
  background:linear-gradient(145deg,#4d91ff,#2c5bb8);
  border-color:#91b9ff;
}

@media (orientation:landscape) and (max-height:650px){
  .app{
    padding-top:7px;
    padding-bottom:7px;
    gap:7px;
  }

  .header{
    display:none;
  }

  .camera-box{
    min-height:180px;
  }

  #camera{
    min-height:180px;
  }

  .controls{
    padding:8px 10px;
  }

  .control-title{
    display:none;
  }

  .mode-list{
    grid-template-columns:repeat(4,1fr);
  }

  .extra-row{
    margin-top:7px;
    padding-top:7px;
  }

  .capture-button{
    width:58px;
    height:58px;
    border-width:5px;
  }

  .capture-button:after{
    inset:5px;
  }

  .switch-camera,.gallery-button{
    width:42px;
    height:42px;
  }

  .live-stamp{
    padding:7px 9px;
    bottom:8px;
  }

  .live-time{
    font-size:13px;
  }

  .live-info{
    font-size:10px;
    margin-top:2px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div class="brand">
      <div class="logo">📍</div>
      <div class="brand-text">
        <b>CAMERA THỜI GIAN THỰC</b>
        <span>Ngày giờ · GPS · Địa chỉ trên ảnh</span>
      </div>
    </div>
    <div id="gps-status" class="gps-status">● Đang tìm GPS...</div>
  </div>

  <div class="camera-box">
    <video id="camera" autoplay playsinline muted></video>
    <div id="grid" class="camera-grid"></div>

    <div id="live-stamp" class="live-stamp">
      <div id="live-time" class="live-time">--/--/---- --:--:--</div>
      <div id="live-info" class="live-info">Đang lấy vị trí...</div>
    </div>

    <div id="no-camera" class="no-camera">
      <div style="font-size:42px">📷</div>
      <strong>Đang chuẩn bị camera</strong>
      <p>Hãy cho phép quyền sử dụng Camera và Vị trí khi trình duyệt yêu cầu.</p>
    </div>
  </div>

  <div class="action-row">
    <button id="switch-camera" class="round-button switch-camera" title="Đổi camera">🔄</button>
    <button id="capture" class="round-button capture-button" title="Chụp ảnh"></button>
    <button id="refresh-location" class="round-button gallery-button" title="Làm mới vị trí">📍</button>
  </div>

  <div class="controls">
    <p class="control-title">NỘI DUNG HIỂN THỊ TRÊN ẢNH</p>

    <div class="mode-list">
      <button class="mode active" data-mode="full">ĐẦY ĐỦ</button>
      <button class="mode" data-mode="time">CHỈ NGÀY GIỜ</button>
      <button class="mode" data-mode="coords">GIỜ + TỌA ĐỘ</button>
      <button class="mode" data-mode="address">GIỜ + ĐỊA CHỈ</button>
    </div>

    <div class="extra-row">
      <label class="toggle-wrap">
        <input id="grid-toggle" type="checkbox" checked>
        <span class="toggle"></span>
        Hiện lưới camera
      </label>

      <select id="stamp-color" class="color-select">
        <option value="yellow">Vàng thời gian</option>
        <option value="blue">Xanh dương</option>
        <option value="green">Xanh lá</option>
        <option value="red">Đỏ</option>
      </select>
    </div>
  </div>
</div>

<div id="result-box">
  <img id="result-image" alt="Ảnh vừa chụp">
  <div class="result-actions">
    <button id="close-result">CHỤP LẠI</button>
    <a id="download-image" download="camera-thoi-gian.jpg">TẢI ẢNH</a>
  </div>
</div>

<canvas id="photo-canvas" hidden></canvas>

<script>
"use strict";

const video = document.getElementById("camera");
const noCamera = document.getElementById("no-camera");
const gpsStatus = document.getElementById("gps-status");
const liveTime = document.getElementById("live-time");
const liveInfo = document.getElementById("live-info");
const liveStamp = document.getElementById("live-stamp");
const canvas = document.getElementById("photo-canvas");
const resultBox = document.getElementById("result-box");
const resultImage = document.getElementById("result-image");
const downloadImage = document.getElementById("download-image");
const grid = document.getElementById("grid");

let currentStream = null;
let facingMode = "environment";
let currentMode = "full";

let locationData = {
  lat: null,
  lng: null,
  accuracy: null,
  address: "Chưa lấy được địa chỉ"
};

const stampThemes = {
  yellow: { accent:"#ffc438", bg:"rgba(0,0,0,.68)" },
  blue:   { accent:"#50a0ff", bg:"rgba(0,16,42,.72)" },
  green:  { accent:"#37df94", bg:"rgba(0,35,20,.72)" },
  red:    { accent:"#ff5e66", bg:"rgba(48,0,4,.74)" }
};

function formatDateTime(date = new Date()) {
  const d = String(date.getDate()).padStart(2, "0");
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const y = date.getFullYear();

  const h = String(date.getHours()).padStart(2, "0");
  const min = String(date.getMinutes()).padStart(2, "0");
  const s = String(date.getSeconds()).padStart(2, "0");

  return `${d}/${m}/${y} ${h}:${min}:${s}`;
}

function getCoordinatesText() {
  if (locationData.lat === null) return "GPS: Đang xác định vị trí...";
  return `GPS: ${locationData.lat.toFixed(6)}, ${locationData.lng.toFixed(6)} • ±${Math.round(locationData.accuracy)}m`;
}

function getDisplayLines() {
  const time = formatDateTime();
  const coords = getCoordinatesText();
  const address = locationData.address || "Chưa lấy được địa chỉ";

  if (currentMode === "time") {
    return [time];
  }

  if (currentMode === "coords") {
    return [time, coords];
  }

  if (currentMode === "address") {
    return [time, address];
  }

  return [time, coords, address];
}

function updateLiveStamp() {
  const lines = getDisplayLines();

  liveTime.textContent = lines[0];
  liveInfo.innerHTML = lines.slice(1).map(line => `<div>${escapeHtml(line)}</div>`).join("");

  if (lines.length === 1) {
    liveInfo.style.display = "none";
  } else {
    liveInfo.style.display = "block";
  }
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function updateStampTheme() {
  const theme = stampThemes[document.getElementById("stamp-color").value];
  liveStamp.style.borderLeftColor = theme.accent;
  liveStamp.style.background = theme.bg;
}

async function startCamera() {
  stopCamera();

  noCamera.classList.remove("hidden");
  noCamera.querySelector("strong").textContent = "Đang mở camera...";
  noCamera.querySelector("p").textContent = "Vui lòng chờ một chút.";

  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    video.srcObject = currentStream;
    await video.play();

    noCamera.classList.add("hidden");
  } catch (error) {
    console.error(error);
    noCamera.classList.remove("hidden");
    noCamera.querySelector("strong").textContent = "Không mở được camera";
    noCamera.querySelector("p").textContent =
      "Hãy kiểm tra quyền Camera. Trang cũng cần được mở bằng HTTPS hoặc localhost.";
  }
}

function stopCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
    currentStream = null;
  }
}

function getLocation() {
  if (!navigator.geolocation) {
    gpsStatus.textContent = "● Máy không hỗ trợ GPS";
    liveInfo.textContent = "Thiết bị không hỗ trợ định vị GPS";
    return;
  }

  gpsStatus.classList.remove("ok");
  gpsStatus.textContent = "● Đang tìm GPS...";

  navigator.geolocation.getCurrentPosition(
    async position => {
      locationData.lat = position.coords.latitude;
      locationData.lng = position.coords.longitude;
      locationData.accuracy = position.coords.accuracy;

      gpsStatus.classList.add("ok");
      gpsStatus.textContent = "● GPS đã kết nối";

      updateLiveStamp();
      await getAddressFromCoordinates();
    },
    error => {
      console.warn(error);

      gpsStatus.classList.remove("ok");
      gpsStatus.textContent = "● Chưa có quyền GPS";
      locationData.address = "Không thể lấy vị trí hiện tại";
      updateLiveStamp();
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 10000
    }
  );
}

async function getAddressFromCoordinates() {
  if (locationData.lat === null || locationData.lng === null) return;

  locationData.address = "Đang tìm địa chỉ...";
  updateLiveStamp();

  try {
    const url =
      "https://nominatim.openstreetmap.org/reverse?format=jsonv2" +
      `&lat=${locationData.lat}&lon=${locationData.lng}` +
      "&zoom=18&addressdetails=1&accept-language=vi";

    const response = await fetch(url, {
      headers: {
        "Accept-Language": "vi"
      }
    });

    if (!response.ok) throw new Error("Không lấy được địa chỉ");

    const data = await response.json();

    if (data.display_name) {
      locationData.address = data.display_name;
    } else {
      locationData.address = "Không xác định được địa chỉ gần đây";
    }
  } catch (error) {
    console.warn(error);
    locationData.address = "Không lấy được địa chỉ trực tuyến";
  }

  updateLiveStamp();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  let currentY = y;

  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + " ";
    const metrics = ctx.measureText(testLine);

    if (metrics.width > maxWidth && n > 0) {
      ctx.fillText(line.trim(), x, currentY);
      line = words[n] + " ";
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }

  if (line.trim()) {
    ctx.fillText(line.trim(), x, currentY);
  }

  return currentY;
}

function capturePhoto() {
  if (!video.videoWidth || !video.videoHeight) {
    alert("Camera chưa sẵn sàng, thử lại sau vài giây nhé.");
    return;
  }

  const width = video.videoWidth;
  const height = video.videoHeight;

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, width, height);

  const lines = getDisplayLines();
  const theme = stampThemes[document.getElementById("stamp-color").value];

  const padding = Math.round(width * 0.035);
  const fontBig = Math.max(28, Math.round(width * 0.033));
  const fontSmall = Math.max(19, Math.round(width * 0.021));
  const lineHeight = Math.round(fontSmall * 1.4);

  ctx.font = `bold ${fontBig}px Arial`;
  const timeHeight = fontBig * 1.5;

  ctx.font = `bold ${fontSmall}px Arial`;
  let infoHeight = 0;

  if (lines.length > 1) {
    for (let i = 1; i < lines.length; i++) {
      const estimatedRows = Math.ceil(ctx.measureText(lines[i]).width / (width - padding * 3));
      infoHeight += estimatedRows * lineHeight;
    }
  }

  const boxHeight = padding * 2 + timeHeight + infoHeight;
  const boxY = height - boxHeight - padding;

  ctx.fillStyle = theme.bg;
  roundRect(ctx, padding, boxY, width - padding * 2, boxHeight, Math.round(width * 0.012));
  ctx.fill();

  ctx.fillStyle = theme.accent;
  ctx.fillRect(padding, boxY, Math.max(8, Math.round(width * 0.009)), boxHeight);

  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "rgba(0,0,0,.9)";
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;

  let textX = padding + Math.round(width * 0.025);
  let textY = boxY + padding + fontBig;

  ctx.font = `bold ${fontBig}px Arial`;
  ctx.fillText(lines[0], textX, textY);

  ctx.font = `bold ${fontSmall}px Arial`;
  textY += Math.round(fontBig * 1.15);

  for (let i = 1; i < lines.length; i++) {
    textY = wrapText(ctx, lines[i], textX, textY, width - padding * 3, lineHeight);
    textY += Math.round(fontSmall * 0.35);
  }

  ctx.shadowColor = "transparent";

  const imageUrl = canvas.toDataURL("image/jpeg", 0.94);
  resultImage.src = imageUrl;
  downloadImage.href = imageUrl;

  const now = new Date();
  const fileDate =
    `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}` +
    `_${String(now.getHours()).padStart(2,"0")}${String(now.getMinutes()).padStart(2,"0")}${String(now.getSeconds()).padStart(2,"0")}`;

  downloadImage.download = `Anh_thoi_gian_${fileDate}.jpg`;

  resultBox.classList.add("show");
}

function roundRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + width, y, x + width, y + height, radius);
  ctx.arcTo(x + width, y + height, x, y + height, radius);
  ctx.arcTo(x, y + height, x, y, radius);
  ctx.arcTo(x, y, x + width, y, radius);
  ctx.closePath();
}

document.querySelectorAll(".mode").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".mode").forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");
    currentMode = button.dataset.mode;
    updateLiveStamp();
  });
});

document.getElementById("switch-camera").addEventListener("click", () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  startCamera();
});

document.getElementById("refresh-location").addEventListener("click", getLocation);

document.getElementById("capture").addEventListener("click", capturePhoto);

document.getElementById("close-result").addEventListener("click", () => {
  resultBox.classList.remove("show");
});

document.getElementById("grid-toggle").addEventListener("change", function() {
  grid.style.display = this.checked ? "block" : "none";
});

document.getElementById("stamp-color").addEventListener("change", updateStampTheme);

setInterval(updateLiveStamp, 1000);

updateLiveStamp();
updateStampTheme();
startCamera();
getLocation();

window.addEventListener("beforeunload", stopCamera);
</script>
</body>
</html>
