<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>HTML Tester</title>

  <!-- CodeMirror: giao diện và tô màu cú pháp -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css"
  >

  <style>
    :root {
      --bg: #171717;
      --panel: #202020;
      --toolbar: #252525;
      --line: #363636;
      --text: #e6e6e6;
      --muted: #9b9b9b;
      --blue: #1684ff;
      --green: #16b55d;
      --red: #e45454;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    .pane {
      display: flex;
      flex: 1;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      background: var(--panel);
    }

    .pane-left {
      border-right: 1px solid #444;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--toolbar);
    }

    .toolbar h1 {
      flex: 1;
      margin: 0;
      overflow: hidden;
      color: #ddd;
      font-size: 17px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shortcut {
      color: #888;
      font-size: 11px;
      white-space: nowrap;
    }

    button {
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: white;
      font: inherit;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(.97);
    }

    .btn-run {
      border-color: #1671d1;
      background: #1679dc;
    }

    .btn-run:hover {
      background: #0d68c2;
    }

    .btn-sample {
      border-color: #535353;
      background: #3a3a3a;
    }

    .btn-sample:hover {
      background: #4a4a4a;
    }

    .btn-clear {
      border-color: #b64040;
      background: #c94646;
    }

    .btn-clear:hover {
      background: #b33737;
    }

    /* Vùng CodeMirror thay cho textarea */
    .CodeMirror {
      flex: 1;
      width: 100%;
      height: auto;
      font-family: Consolas, "Courier New", monospace;
      font-size: 16px;
      line-height: 1.55;
    }

    .cm-s-material-darker.CodeMirror {
      background: #202020;
    }

    .cm-s-material-darker .CodeMirror-gutters {
      border-right: 1px solid #303030;
      background: #1a1a1a;
    }

    .cm-s-material-darker .CodeMirror-linenumber {
      padding: 0 10px 0 5px;
      color: #777;
    }

    .cm-s-material-darker .CodeMirror-cursor {
      border-left-color: #f0f0f0;
    }

    .cm-s-material-darker .CodeMirror-activeline-background {
      background: rgba(255, 255, 255, .045);
    }

    #preview {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .preview-title {
      display: flex;
      align-items: center;
      min-height: 56px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      color: #d8d8d8;
      background: var(--toolbar);
      font-size: 15px;
      font-weight: bold;
    }

    .preview-title span {
      margin-left: 8px;
      color: #888;
      font-size: 12px;
      font-weight: normal;
    }

    @media (max-width: 720px) {
      body {
        overflow: auto;
      }

      .container {
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
      }

      .pane {
        flex: none;
      }

      .pane-left {
        height: 58dvh;
        min-height: 360px;
        border-right: 0;
        border-bottom: 2px solid #3a3a3a;
      }

      .pane:not(.pane-left) {
        height: 42dvh;
        min-height: 280px;
      }

      .toolbar {
        gap: 6px;
        padding: 8px;
      }

      .toolbar h1 {
        display: none;
      }

      .shortcut {
        display: none;
      }

      button {
        flex: 1;
        min-height: 38px;
        padding: 8px 7px;
        font-size: 12px;
      }

      .CodeMirror {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="pane pane-left">
      <header class="toolbar">
        <h1>HTML Tester</h1>
        <span class="shortcut">Ctrl / Cmd + Enter để chạy</span>

        <button class="btn-run" id="runButton" type="button">
          ▶ Run
        </button>

        <button class="btn-sample" id="sampleButton" type="button">
          ↺ Mẫu
        </button>

        <button class="btn-clear" id="clearButton" type="button">
          🗑 Xóa
        </button>
      </header>

      <!-- Code mẫu sẽ được CodeMirror biến thành trình soạn thảo có màu -->
      <textarea id="editor" spellcheck="false"><!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang thử nghiệm</title>

  <style>
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      color: white;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1677ff, #7b35d8);
    }

    .card {
      width: min(85%, 420px);
      padding: 28px;
      border-radius: 18px;
      text-align: center;
      background: rgba(255, 255, 255, .16);
      box-shadow: 0 14px 35px rgba(0, 0, 0, .25);
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      color: #184b9a;
      background: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>HTML Tester Online</h1>
    <p>Viết code bên trái và bấm Run để xem kết quả.</p>
    <button onclick="alert('Chào bạn!')">Bấm thử</button>
  </main>
</body>
</html></textarea>
    </section>

    <section class="pane">
      <div class="preview-title">
        Xem trước
        <span>Preview</span>
      </div>

      <iframe
        id="preview"
        title="Khung xem trước HTML"
        sandbox="allow-scripts"
      ></iframe>
    </section>

  </main>

  <!-- CodeMirror và các mode để nhận diện HTML / CSS / JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

  <script>
    "use strict";

    const STORAGE_KEY = "html-tester-code";
    const textarea = document.getElementById("editor");
    const preview = document.getElementById("preview");
    const runButton = document.getElementById("runButton");
    const clearButton = document.getElementById("clearButton");
    const sampleButton = document.getElementById("sampleButton");

    const sampleCode = textarea.value;

    const editor = CodeMirror.fromTextArea(textarea, {
      mode: "htmlmixed",
      theme: "material-darker",
      lineNumbers: true,
      lineWrapping: true,
      styleActiveLine: true,
      indentUnit: 2,
      tabSize: 2,
      indentWithTabs: false,
      autofocus: false
    });

    function runCode() {
      preview.srcdoc = editor.getValue();
    }

    function clearCode() {
      editor.setValue("");
      preview.srcdoc = "";
      editor.focus();
    }

    function restoreSample() {
      editor.setValue(sampleCode);
      runCode();
      editor.focus();
    }

    function saveCode() {
      try {
        localStorage.setItem(STORAGE_KEY, editor.getValue());
      } catch (error) {
        console.warn("Không thể lưu code trên thiết bị.", error);
      }
    }

    function loadSavedCode() {
      try {
        const savedCode = localStorage.getItem(STORAGE_KEY);

        if (savedCode !== null) {
          editor.setValue(savedCode);
        }
      } catch (error) {
        console.warn("Không thể đọc code đã lưu.", error);
      }
    }

    runButton.addEventListener("click", runCode);
    clearButton.addEventListener("click", clearCode);
    sampleButton.addEventListener("click", restoreSample);

    editor.on("change", saveCode);

    editor.on("keydown", (instance, event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        runCode();
      }
    });

    loadSavedCode();
    runCode();
  </script>
</body>
</html>
