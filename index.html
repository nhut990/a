<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phân tích hợp âm từ MP3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #f9f9f9;
            color: #222;
        }
        h1 {
            font-size: 1.6rem;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 0.4rem;
        }
        .upload-area {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin: 1.5rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }
        input[type="file"] {
            flex: 1;
            padding: 0.5rem;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #result {
            background: white;
            padding: 1.2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .loading {
            color: #555;
            font-style: italic;
        }
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 0.6rem;
            border-radius: 4px;
        }
        .chord-item {
            display: inline-block;
            background: #e8f5e9;
            padding: 0.2rem 0.6rem;
            margin: 0.2rem 0.1rem;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .time-tag {
            color: #888;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<h1>🎵 Trích xuất hợp âm từ MP3</h1>

<div class="upload-area">
    <input type="file" id="fileInput" accept="audio/*" />
    <button id="analyzeBtn">▶ Phân tích hợp âm</button>
</div>

<div id="result">
    <span class="loading">Chọn file và nhấn nút để bắt đầu...</span>
</div>

<!-- Sử dụng Import Map để load thư viện từ CDN -->
<script type="importmap">
{
    "imports": {
        "@libraz/libsonare": "https://unpkg.com/@libraz/libsonare@0.4.0/dist/index.mjs"
    }
}
</script>

<script type="module">
    import { AudioProcessor, ChordRecognizer } from '@libraz/libsonare';

    const fileInput = document.getElementById('fileInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultDiv = document.getElementById('result');

    // Xử lý sự kiện nhấn nút
    analyzeBtn.addEventListener('click', async () => {
        const file = fileInput.files[0];
        if (!file) {
            resultDiv.innerHTML = '<span class="error">⚠️ Vui lòng chọn một file âm thanh trước.</span>';
            return;
        }

        // Vô hiệu hóa nút để tránh spam
        analyzeBtn.disabled = true;
        resultDiv.innerHTML = '<span class="loading">⏳ Đang xử lý file, vui lòng chờ...</span>';

        try {
            // 1. Đọc file thành ArrayBuffer
            const arrayBuffer = await file.arrayBuffer();

            // 2. Khởi tạo AudioProcessor và giải mã audio
            const audioProcessor = new AudioProcessor();
            const audioBuffer = await audioProcessor.decodeAudioFile(arrayBuffer);

            // 3. Trích xuất đặc trưng Chroma (dùng để nhận dạng hợp âm)
            const chroma = await audioProcessor.extractChroma(audioBuffer);

            // 4. Nhận dạng hợp âm
            const chordRecognizer = new ChordRecognizer();
            const chordResult = chordRecognizer.recognizeChords(chroma);

            // 5. Hiển thị kết quả
            displayChords(chordResult);

        } catch (error) {
            console.error(error);
            resultDiv.innerHTML = `<span class="error">❌ Lỗi: ${error.message || 'Không thể phân tích file. Hãy thử file khác.'}</span>`;
        } finally {
            analyzeBtn.disabled = false;
        }
    });

    /**
     * Hiển thị danh sách hợp âm dạng đẹp
     * @param {Array} chordResult - Mảng các đối tượng { time, chord }
     */
    function displayChords(chordResult) {
        if (!chordResult || chordResult.length === 0) {
            resultDiv.innerHTML = '<span class="error">😕 Không phát hiện hợp âm nào. Hãy thử file nhạc rõ ràng hơn.</span>';
            return;
        }

        let html = `<div style="margin-bottom: 0.5rem;">🎸 <strong>${chordResult.length}</strong> hợp âm được phát hiện:</div>`;
        html += '<div style="display: flex; flex-wrap: wrap; gap: 0.3rem;">';

        chordResult.forEach(item => {
            const timeStr = item.time.toFixed(2);
            const chordName = item.chord || '?';
            html += `<span class="chord-item">
                        <span class="time-tag">${timeStr}s</span>
                        ${chordName}
                    </span>`;
        });

        html += '</div>';
        resultDiv.innerHTML = html;
    }

    // Hỗ trợ kéo thả file (tùy chọn)
    document.querySelector('.upload-area').addEventListener('dragover', (e) => {
        e.preventDefault();
        e.currentTarget.style.border = '2px dashed #4CAF50';
    });
    document.querySelector('.upload-area').addEventListener('dragleave', (e) => {
        e.preventDefault();
        e.currentTarget.style.border = 'none';
    });
    document.querySelector('.upload-area').addEventListener('drop', (e) => {
        e.preventDefault();
        e.currentTarget.style.border = 'none';
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            fileInput.files = files;
        }
    });
</script>

</body>
</html>
